
{% extends "base.html" %}

{% block title %}Iniciar sesión | IS1{% endblock %}

{% block content %}
<section class="auth-container">
    <div class="auth-card">
        <span class="eyebrow">QUÉ BUENO TENERTE DE VUELTA</span>
        <h1>Iniciar sesión</h1>
        <p class="auth-description">
            Ingresá a tu cuenta para participar en la comunidad.
        </p>

        <form method="POST" class="form">
            <label for="email">Correo electrónico</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="tu@correo.com"
                required
            >

            <label for="contrasena">Contraseña</label>
            <input
                type="password"
                id="contrasena"
                name="contrasena"
                placeholder="Ingresá tu contraseña"
                required
            >

            <button type="submit" class="button button-full">
                Ingresar
            </button>
        </form>

        <p class="auth-switch">
            ¿Todavía no tenés cuenta?
            <a href="{{ url_for('web.registro') }}">Registrate</a>
        </p>
    </div>
</section>
{% endblock %}
