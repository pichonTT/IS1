[project]
name = "is1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "IvoMirkoE22", email = "ivomirkoelian20@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
is1 = "is1:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
