
{% extends "base.html" %}

{% block title %}Crear cuenta | IS1{% endblock %}

{% block content %}
<section class="auth-container">
    <div class="auth-card">
        <span class="eyebrow">BIENVENIDO A IS1</span>
        <h1>Crear una cuenta</h1>
        <p class="auth-description">
            Registrate para participar en la comunidad y compartir tus conocimientos.
        </p>

        <form method="POST" class="form">
            <label for="email">Correo electrónico</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="tu@correo.com"
                required
            >

            <label for="contrasena">Contraseña</label>
            <input
                type="password"
                id="contrasena"
                name="contrasena"
                placeholder="Ingresá una contraseña"
                minlength="8"
                required
            >

            <button type="submit" class="button button-full">
                Crear mi cuenta
            </button>
        </form>

        <p class="auth-switch">
            ¿Ya tenés una cuenta?
            <a href="{{ url_for('web.login') }}">Iniciá sesión</a>
        </p>
    </div>
</section>
{% endblock %}
